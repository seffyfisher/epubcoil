<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <title>epub.co.il</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
  <style>
    :root {
      --bg: #0b0b0c;
      --fg: #f4f4f5;
      --muted: #a1a1aa;
      --panel: rgba(24, 24, 27, 0.96);
      --border: rgba(255,255,255,0.1);
      --accent: #7c5cff;
      --control-bg: #27272a;
      --control-fg: #f4f4f5;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --chrome: 56px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Hebrew", Arial, sans-serif;
      overflow: hidden; -webkit-tap-highlight-color: transparent;
    }
    #app { height: 100%; display: flex; flex-direction: column; position: relative; }
    #topbar {
      flex: 0 0 auto;
      min-height: calc(var(--chrome) + var(--safe-top));
      padding: calc(8px + var(--safe-top)) 12px 8px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      z-index: 60; position: relative;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }
    .icon-btn {
      width: 44px; height: 44px; min-width: 44px; min-height: 44px;
      border-radius: 999px; border: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 70%, #000 30%); color: var(--fg);
      display: grid; place-items: center;
      cursor: pointer; backdrop-filter: blur(8px);
    }
    .icon-btn svg { width: 22px; height: 22px; fill: currentColor; }
    #progressWrap {
      flex: 1; max-width: 46vw; height: 6px; border-radius: 999px;
      background: color-mix(in srgb, var(--fg) 18%, transparent);
      overflow: hidden; align-self: center;
    }
    #progressBar { height: 100%; width: 0%; background: var(--accent); transition: width .2s ease; }
    #pct { font-size: 12px; color: var(--muted); min-width: 3.2em; text-align: center; }
    #viewer {
      flex: 1; width: 100%; height: 100%; position: relative;
      touch-action: pan-y; user-select: none; overflow: hidden;
    }
    #viewer iframe { border: 0 !important; }
    .tap-zone {
      position: absolute; top: 0; bottom: 0; width: 18%; z-index: 5;
    }
    .tap-zone.next { left: 0; right: auto; }   /* physical left = Next (RTL + ArrowLeft) */
    .tap-zone.prev { right: 0; left: auto; }  /* physical right = Prev */
    #status {
      position: absolute; inset: 0; display: grid; place-items: center; z-index: 20;
      background: var(--bg); color: var(--muted); font-size: 15px; padding: 24px; text-align: center;
    }
    #status.hidden { display: none; }
    #sheetBackdrop {
      position: absolute; inset: 0; background: rgba(0,0,0,.45); z-index: 40;
      opacity: 0; pointer-events: none; transition: opacity .2s ease;
    }
    #sheetBackdrop.open { opacity: 1; pointer-events: auto; }
    #sheet {
      position: absolute; inset-inline: 0; bottom: 0; z-index: 50;
      background: var(--panel); border-top: 1px solid var(--border);
      border-radius: 18px 18px 0 0; padding: 10px 16px calc(16px + var(--safe-bottom));
      transform: translateY(110%); transition: transform .22s ease;
      max-height: min(72vh, 520px); overflow: auto;
    }
    #sheet.open { transform: translateY(0); }
    .sheet-handle {
      width: 42px; height: 4px; border-radius: 999px; background: rgba(255,255,255,.25);
      margin: 2px auto 14px;
    }
    .row { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; flex-wrap: wrap; }
    .row label { font-size: 13px; color: var(--muted); min-width: 4.5em; }
    select, input[type="range"], input[type="file"] {
      flex: 1; min-width: 0; accent-color: var(--accent);
    }
    select, input[type="file"] {
      background: var(--control-bg); color: var(--control-fg); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px; font-size: 14px;
    }
    select option { background: var(--control-bg); color: var(--control-fg); }
    .nav-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
    .nav-row button {
      border: 0; border-radius: 12px; padding: 14px 12px; min-height: 48px; font-weight: 600; font-size: 15px;
      background: linear-gradient(135deg, #6a11cb, #2575fc); color: #fff; cursor: pointer;
    }
    #fontVal { font-size: 13px; color: var(--muted); min-width: 3em; }
    body.theme-day { --bg: #f7f7f5; --fg: #111; --muted: #666; --panel: rgba(255,255,255,.97); --border: rgba(0,0,0,.1); --accent: #4f46e5; --control-bg: #ffffff; --control-fg: #111111; }
    body.theme-sepia { --bg: #f3e7d3; --fg: #4a3728; --muted: #7a5c45; --panel: rgba(250,240,220,.97); --border: rgba(90,60,30,.15); --accent: #a16207; --control-bg: #faf0dc; --control-fg: #4a3728; }
    body.theme-night { --control-bg: #27272a; --control-fg: #f4f4f5; }
  </style>
</head>
<body class="theme-night">
  <div id="app">
    <div id="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="הגדרות" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
      </button>
      <div id="progressWrap" aria-hidden="true"><div id="progressBar"></div></div>
      <div id="pct">0%</div>
    </div>

    <div id="viewer" tabindex="0">
      <div class="tap-zone next" id="tapNext"></div>
      <div class="tap-zone prev" id="tapPrev"></div>
    </div>

    <div id="status">טוען את הספר…</div>

    <div id="sheetBackdrop"></div>
    <div id="sheet" role="dialog" aria-label="הגדרות קריאה">
      <div class="sheet-handle"></div>
      <div class="row">
        <label for="themeSelect">ערכת נושא</label>
        <select id="themeSelect">
          <option value="day">יום</option>
          <option value="night" selected>לילה</option>
          <option value="sepia">ספיה</option>
        </select>
      </div>
      <div class="row">
        <label for="fontSize">גודל</label>
        <input id="fontSize" type="range" min="14" max="40" value="20" />
        <span id="fontVal">20px</span>
      </div>
      <div class="row">
        <label for="toc">תוכן עניינים</label>
        <select id="toc"><option value="">—</option></select>
      </div>
      <div class="row">
        <label for="fileInput">קובץ EPUB</label>
        <input id="fileInput" type="file" accept=".epub,application/epub+zip" />
      </div>
      <div class="nav-row">
        <button type="button" id="prevBtn">הקודם</button>
        <button type="button" id="nextBtn">הבא</button>
      </div>
    </div>
  </div>

  <script>
  (function () {
    const STORAGE_KEY = 'epubcoil.reader.v1';
    const DEFAULT_BOOK = 'hebrew.epub';

    const els = {
      viewer: document.getElementById('viewer'),
      status: document.getElementById('status'),
      sheet: document.getElementById('sheet'),
      backdrop: document.getElementById('sheetBackdrop'),
      menuBtn: document.getElementById('menuBtn'),
      themeSelect: document.getElementById('themeSelect'),
      fontSize: document.getElementById('fontSize'),
      fontVal: document.getElementById('fontVal'),
      toc: document.getElementById('toc'),
      fileInput: document.getElementById('fileInput'),
      prevBtn: document.getElementById('prevBtn'),
      nextBtn: document.getElementById('nextBtn'),
      tapPrev: document.getElementById('tapPrev'),
      tapNext: document.getElementById('tapNext'),
      progressBar: document.getElementById('progressBar'),
      pct: document.getElementById('pct'),
    };

    let book = null;
    let rendition = null;
    let bookId = DEFAULT_BOOK;
    let prefs = loadPrefs();

    function loadPrefs() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {}; }
      catch { return {}; }
    }
    function savePrefs() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(prefs)); } catch {}
    }

    function setStatus(msg) {
      if (!msg) { els.status.classList.add('hidden'); els.status.textContent = ''; return; }
      els.status.classList.remove('hidden');
      els.status.textContent = msg;
    }

    function openSheet(open) {
      els.sheet.classList.toggle('open', open);
      els.backdrop.classList.toggle('open', open);
    }

    function applyChromeTheme(name) {
      document.body.classList.remove('theme-day', 'theme-night', 'theme-sepia');
      document.body.classList.add('theme-' + name);
      const colors = { day: '#f7f7f5', night: '#0b0b0c', sepia: '#f3e7d3' };
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', colors[name] || colors.night);
    }

    function registerThemes() {
      if (!rendition) return;
      rendition.themes.register('day', { body: { background: '#ffffff', color: '#111111' }, a: { color: '#1d4ed8' } });
      rendition.themes.register('night', { body: { background: '#121214', color: '#f4f4f5' }, a: { color: '#a5b4fc' } });
      rendition.themes.register('sepia', { body: { background: '#f5deb3', color: '#5b4636' }, a: { color: '#9a3412' } });
    }

    function applyTheme(name) {
      prefs.theme = name;
      els.themeSelect.value = name;
      applyChromeTheme(name);
      if (rendition) rendition.themes.select(name);
      savePrefs();
    }

    function applyFont(px) {
      const n = Math.max(14, Math.min(40, Number(px) || 20));
      prefs.fontSize = n;
      els.fontSize.value = String(n);
      els.fontVal.textContent = n + 'px';
      if (rendition) rendition.themes.fontSize(n + 'px');
      savePrefs();
    }

    function updateProgress(location) {
      if (!book || !book.locations || !book.locations.length()) {
        els.progressBar.style.width = '0%';
        els.pct.textContent = '0%';
        return;
      }
      try {
        const cfi = location && location.start && location.start.cfi;
        const pct = cfi ? book.locations.percentageFromCfi(cfi) : 0;
        const p = Math.max(0, Math.min(100, Math.round((pct || 0) * 100)));
        els.progressBar.style.width = p + '%';
        els.pct.textContent = p + '%';
      } catch {
        els.pct.textContent = '—';
      }
    }

    function rememberLocation(location) {
      if (!location || !location.start) return;
      prefs.locations = prefs.locations || {};
      prefs.locations[bookId] = location.start.cfi;
      savePrefs();
    }

    function fillToc(nav) {
      els.toc.innerHTML = '';
      const blank = document.createElement('option');
      blank.value = '';
      blank.textContent = 'בחר פרק';
      els.toc.appendChild(blank);
      const walk = (items, depth) => {
        (items || []).forEach((item) => {
          const opt = document.createElement('option');
          opt.value = item.href;
          opt.textContent = (depth ? '— '.repeat(depth) : '') + (item.label || '').trim();
          els.toc.appendChild(opt);
          if (item.subitems && item.subitems.length) walk(item.subitems, depth + 1);
        });
      };
      walk(nav && nav.toc, 0);
    }

    function destroyBook() {
      try { if (rendition) rendition.destroy(); } catch {}
      try { if (book) book.destroy(); } catch {}
      book = null;
      rendition = null;
      els.viewer.querySelectorAll('iframe, .epub-view').forEach((n) => n.remove());
    }

    async function openBook(urlOrArrayBuffer, id) {
      setStatus('טוען את הספר…');
      destroyBook();
      bookId = id || DEFAULT_BOOK;
      book = ePub(urlOrArrayBuffer);
      rendition = book.renderTo(els.viewer, {
        width: '100%',
        height: '100%',
        // scrolled-doc: avoid epub.js RTL column-pagination bug where next()
        // advances CFI but the visible frame never shifts (stuck mid-book).
        flow: 'scrolled-doc',
        spread: 'none',
        allowScriptedContent: true,
      });
      registerThemes();
      applyTheme(prefs.theme || 'night');
      applyFont(prefs.fontSize || 20);

      rendition.on('relocated', (loc) => {
        updateProgress(loc);
        rememberLocation(loc);
      });

      try {
        await book.ready;
        const nav = await book.loaded.navigation;
        fillToc(nav);
        await book.locations.generate(1600);
        const saved = prefs.locations && prefs.locations[bookId];
        if (saved) await rendition.display(saved);
        else await rendition.display();
        setStatus('');
      } catch (err) {
        console.error(err);
        setStatus('לא הצלחתי לפתוח את הספר. נסו שוב או בחרו קובץ אחר.');
      }
    }

    function getActiveScroll() {
      if (!rendition) return null;
      try {
        // scrolled-doc sizes the iframe to full section height; the real
        // viewport scroller is epub.js '.epub-container' inside #viewer.
        const container = els.viewer.querySelector('.epub-container');
        if (container) {
          return { el: container, pageH: container.clientHeight || els.viewer.clientHeight };
        }
        const contents = rendition.getContents && rendition.getContents()[0];
        if (!contents || !contents.document) return null;
        const doc = contents.document;
        const el = doc.scrollingElement || doc.documentElement || doc.body;
        if (!el) return null;
        return { el, pageH: contents.window ? contents.window.innerHeight : el.clientHeight };
      } catch {
        return null;
      }
    }

    function atSpineEnd() {
      try {
        const loc = rendition.currentLocation && rendition.currentLocation();
        return !!(loc && loc.atEnd);
      } catch {
        return false;
      }
    }

    function atSpineStart() {
      try {
        const loc = rendition.currentLocation && rendition.currentLocation();
        return !!(loc && loc.atStart);
      } catch {
        return false;
      }
    }

    function nextPage() {
      if (!rendition) return;
      const s = getActiveScroll();
      if (s) {
        const before = s.el.scrollTop;
        const max = Math.max(0, s.el.scrollHeight - s.el.clientHeight);
        if (before < max - 2) {
          s.el.scrollBy(0, Math.max(120, Math.floor((s.pageH || s.el.clientHeight) * 0.92)));
          if (s.el.scrollTop > before + 1) return;
        }
      }
      if (atSpineEnd()) return;
      rendition.next();
    }

    function prevPage() {
      if (!rendition) return;
      const s = getActiveScroll();
      if (s && s.el.scrollTop > 2) {
        const before = s.el.scrollTop;
        s.el.scrollBy(0, -Math.max(120, Math.floor((s.pageH || s.el.clientHeight) * 0.92)));
        if (s.el.scrollTop < before - 1) return;
      }
      if (atSpineStart()) return;
      rendition.prev();
    }

    // Swipe (RTL-natural: swipe right → next)
    let startX = 0, startY = 0, tracking = false;
    els.viewer.addEventListener('touchstart', (e) => {
      if (!e.touches || e.touches.length !== 1) return;
      tracking = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, { passive: true });
    els.viewer.addEventListener('touchend', (e) => {
      if (!tracking || !e.changedTouches || !e.changedTouches.length) return;
      tracking = false;
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
      if (dx > 0) nextPage(); else prevPage();
    }, { passive: true });

    els.tapNext.addEventListener('click', nextPage);
    els.tapPrev.addEventListener('click', prevPage);
    els.nextBtn.addEventListener('click', nextPage);
    els.prevBtn.addEventListener('click', prevPage);

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') { e.preventDefault(); nextPage(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); prevPage(); }
      else if (e.key === 'Escape') openSheet(false);
    });

    els.menuBtn.addEventListener('click', () => openSheet(!els.sheet.classList.contains('open')));
    els.backdrop.addEventListener('click', () => openSheet(false));
    els.themeSelect.addEventListener('change', () => applyTheme(els.themeSelect.value));
    els.fontSize.addEventListener('input', () => applyFont(els.fontSize.value));
    els.toc.addEventListener('change', () => {
      const href = els.toc.value;
      if (href && rendition) rendition.display(href);
      openSheet(false);
    });
    els.fileInput.addEventListener('change', async () => {
      const file = els.fileInput.files && els.fileInput.files[0];
      if (!file) return;
      const buf = await file.arrayBuffer();
      openSheet(false);
      await openBook(buf, 'file:' + file.name);
    });

    // init prefs into UI
    applyChromeTheme(prefs.theme || 'night');
    els.themeSelect.value = prefs.theme || 'night';
    els.fontSize.value = String(prefs.fontSize || 20);
    els.fontVal.textContent = (prefs.fontSize || 20) + 'px';

    openBook(DEFAULT_BOOK, DEFAULT_BOOK);
  })();
  </script>
</body>
</html>
